    trail.push({ x: W / 2 + px * s * SC, y: H / 2 - (y2 + .35) * s * SC, vx: (Math.random() - .5) * .25 * SC, vy: (Math.random() - .3) * .1 * SC, t0: a, life: 1.1 + Math.random() * .9, r: .7 + Math.random() * 1.3, c: TR[Math.random() * 3 | 0], s: Math.min(1, sz) });
  }
  const T = (lx, ly, lz) => [px + sz * (lx * rx + ly * ux + lz * fx), py + sz * (lx * 0 + ly * uy + lz * fy) , pz + sz * (lx * rz + ly * uz + lz * fz)];
  for (const sd of [-1, 1]) for (let i = 0; i < BF.length; i += 3) {
    const wx = sd * BF[i] * ca, wy = BF[i] * sa, p = T(wx, wy, BF[i + 1]);
    plot(p[0], p[1], p[2], rx * sa * -sd + ux * ca, uy * ca, rz * sa * -sd + uz * ca, BF[i + 2]);
  }
  for (let z = -.2; z <= .2; z += .025) for (let q = 0; q < 4; q++) { const p = T(.02 * Math.cos(q * PI / 2), .02 * Math.sin(q * PI / 2), z); plot(p[0], p[1], p[2], ux, uy, uz, 28) }
}
function draw(u, a) {
  ctx.clearRect(0, 0, W, H);
  const gp = GR.map(([s, d]) => cl01((u - s) / d)), ss = a - CFG.spin * CFG.cycle, kk = 2, xr = cl01(ss / kk);
  const yaw = -.45 + CFG.spinSpeed * (ss <= 0 ? 0 : ss < kk ? kk * (xr * xr * xr - xr * xr * xr * xr / 2) : kk / 2 + ss - kk), cy = Math.cos(yaw), sy = Math.sin(yaw);
  zb.fill(-1e9); cc.fill(-1);
  for (let i = 0, o = 0; i < N; i++, o += 19) {
    const p = gp[AF[o + 13]]; if (p < AF[o + 15]) continue;
    const f = sm((p - AF[o + 14]) / .28); let x, y, z;
    if (f < .5) { const t = f * 2; x = AF[o] + (AF[o + 3] - AF[o]) * t; y = AF[o + 1] + (AF[o + 4] - AF[o + 1]) * t; z = AF[o + 2] + (AF[o + 5] - AF[o + 2]) * t }
    else { const t = f * 2 - 1; x = AF[o + 3] + (AF[o + 6] - AF[o + 3]) * t; y = AF[o + 4] + (AF[o + 7] - AF[o + 4]) * t; z = AF[o + 5] + (AF[o + 8] - AF[o + 5]) * t }
    const w = Math.max(.05, Math.min(.22, 1 - AF[o + 15])), gs = sm((p - AF[o + 15]) / w);
    x = AF[o + 16] + (x - AF[o + 16]) * gs; y = AF[o + 17] + (y - AF[o + 17]) * gs; z = AF[o + 18] + (z - AF[o + 18]) * gs;
    const nx = AF[o + 9], nz = AF[o + 11];
    plot(x * cy + z * sy, y, -x * sy + z * cy, nx * cy + nz * sy, AF[o + 10], -nx * sy + nz * cy, AF[o + 12]);
  }
  butterfly(a);
  for (const bk of buckets) bk.length = 0;
  for (let k = 0; k < cc.length; k++) if (cc[k] >= 0) buckets[cc[k] * LV + cl[k]].push(k);
  for (let q = 0; q < buckets.length; q++) { const bk = buckets[q]; if (!bk.length) continue; ctx.fillStyle = fills[q]; const chr = RAMP[q % LV]; for (const k of bk) ctx.fillText(chr, (k % cols + .5) * cw, ((k / cols | 0) + .5) * ch) }
  drawTrail(a);
}

const R = Math.random, tints = ['#fff', '#fff', '#fff', '#ffe9c4', '#cfe3ff'];
const stars = Array.from({ length: isM ? Math.round(CFG.stars * .6) : CFG.stars }, () => { const big = R() < .07; return { x: R(), y: R(), r: big ? 1.1 + R() * .7 : .4 + R() * R() * 1.0, a: big ? .7 + R() * .3 : .15 + R() * .5, p: R() * TAU, w: .4 + R() * 1.3, big, c: tints[R() * 5 | 0] } });
const sparks = Array.from({ length: isM ? 16 : 28 }, () => ({ xo: (R() - .5) * 3.4, sp: .05 + R() * .06, ph: R(), r: .6 + R() * 1.1, c: R() < .5 ? '#ffd9a0' : '#ffb6cf', w: R() * TAU }));
let shoot = null, nextShoot = 4;
function drawStars(t, a) {
  sx.clearRect(0, 0, W, H);
  for (const s of stars) {
    const tw = .55 + .45 * Math.sin(t * s.w + s.p), x = s.x * W, y = s.y * H;
    sx.globalAlpha = s.a * tw; sx.fillStyle = s.c;
    if (s.r < .9) sx.fillRect(x - s.r, y - s.r, s.r * 2, s.r * 2); else { sx.beginPath(); sx.arc(x, y, s.r, 0, TAU); sx.fill() }
    if (s.big) { sx.globalAlpha = s.a * tw * tw * .5; sx.strokeStyle = s.c; sx.lineWidth = .7; const l = s.r * 4.5 * tw; sx.beginPath(); sx.moveTo(x - l, y); sx.lineTo(x + l, y); sx.moveTo(x, y - l); sx.lineTo(x, y + l); sx.stroke() }
  }
  if (!shoot && t > nextShoot) { const g = .35 + R() * .3; shoot = { x: W * (.3 + R() * .6), y: H * R() * .4, vx: -Math.cos(g), vy: Math.sin(g), t0: t }; nextShoot = t + 8 + R() * 9 }
  if (shoot) { const k = t - shoot.t0; if (k > 1) shoot = null; else { sx.fillStyle = '#fff'; for (let i = 0; i < 10; i++) { const o = k * Math.min(W, H) * .5 - i * 7; sx.globalAlpha = (1 - k) * (1 - i / 10) * .8; sx.fillRect(shoot.x + shoot.vx * o, shoot.y + shoot.vy * o, 2, 2) } } }
  if (a > 0) { const ap = sm((a - CFG.spin * CFG.cycle * .85) / 3);
    if (ap > 0) for (const q of sparks) { const p = (t * q.sp + q.ph) % 1, x = W / 2 + (q.xo + Math.sin(t * .7 + q.w) * .1) * SC, y = H / 2 + (1.1 - p * 3) * SC; sx.globalAlpha = Math.sin(p * PI) * ap * (.45 + .35 * Math.sin(t * 3 + q.w)); sx.fillStyle = q.c; sx.beginPath(); sx.arc(x, y, q.r, 0, TAU); sx.fill() } }
  sx.globalAlpha = 1;
}

const bgm = new Audio(), playBtn = document.getElementById('play'), muteBtn = document.getElementById('mute');
bgm.src = CFG.music; bgm.loop = true; bgm.preload = 'auto';
let started = false, muted = false, realPlay = false, base = 0, fc = 0;
bgm.addEventListener('error', () => console.warn('File musik tidak ditemukan: ' + CFG.music + ' — animasi tetap berjalan tanpa suara'));
function frame(now) {
  requestAnimationFrame(frame);
  if (++fc % 2 == 0) drawStars(now / 1000, started ? (now - base) / 1000 : -1);
  if (started) { const a = (now - base) / 1000; draw(Math.min(a / CFG.cycle, 1), a) }
}
playBtn.addEventListener('click', () => {
  if (started) return; started = true; playBtn.disabled = true; playBtn.classList.add('gone'); muteBtn.classList.add('show');
  base = performance.now();

  bgm.muted = true; const unlock = Promise.resolve(bgm.play()).then(() => { bgm.pause(); bgm.currentTime = 0 }).catch(() => {});
  setTimeout(() => unlock.then(() => { bgm.currentTime = 0; bgm.muted = muted; realPlay = true; const p = bgm.play(); if (p && p.catch) p.catch(() => {}) }), CFG.lead * 1000);
});
muteBtn.addEventListener('click', () => { muted = !muted; if (realPlay) bgm.muted = muted; muteBtn.classList.toggle('off', muted) });
addEventListener('resize', resize); resize(); requestAnimationFrame(frame);
</script>
</body>
</html>
